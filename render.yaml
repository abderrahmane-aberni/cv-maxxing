# Render Blueprint for CV-Maxxing: backend (FastAPI) + frontend (Streamlit),
# as two separate free web services. Deploy: render.com -> New -> Blueprint
# -> point at this repo. Secret env vars (GEMINI_API_KEY, DATABASE_URL,
# BACKEND_URL) are intentionally left blank here -- fill them in the
# Render dashboard during/after the Blueprint setup.
services:
  - type: web
    name: cv-maxxing-backend
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: DATABASE_URL
        sync: false
      - key: RATE_LIMIT_PER_IP_PER_HOUR
        value: "5"
      - key: RATE_LIMIT_GLOBAL_PER_DAY
        value: "50"

  - type: web
    name: cv-maxxing-frontend
    runtime: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: .
    envVars:
      # Set this to the cv-maxxing-backend service's URL once it exists
      # (e.g. https://cv-maxxing-backend-xxxx.onrender.com) -- no trailing
      # slash, no /health on the end.
      - key: BACKEND_URL
        sync: false
